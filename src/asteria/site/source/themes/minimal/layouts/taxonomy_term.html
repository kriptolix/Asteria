{% extends "base.html" %}

{% block title %}{{ term.name }} — {{ kind_label }} — {{ site.title }}{% endblock %}

{% block content %}
<section class="taxonomy-term">
    <h1 class="document__title">{{ kind_label }}: {{ term.name }}</h1>
    <ul class="post-list">
        {% for post in posts %}
        <li>
            <a href="{{ post.url }}">{{ post.title }}</a>
            {% if post.date %}<time datetime="{{ post.date }}">{{ post.date }}</time>{% endif %}
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
